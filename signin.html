<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — BORA LIVE</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f5f3ff, #ffffff);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(17, 24, 39, 0.12);
    }

    .logo {
      text-align: center;
      font-size: 32px;
      font-style: italic;
      color: #111827;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 32px;
    }

    label {
      display: block;
      color: #111827;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      height: 48px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      padding: 0 14px;
      font-size: 15px;
      margin-bottom: 18px;
      outline: none;
    }

    input:focus {
      border-color: #7c3aed;
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.12);
    }

    button {
      width: 100%;
      height: 48px;
      border: none;
      border-radius: 999px;
      background: #6d28d9;
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background: #5b21b6;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 24px;
      color: #6d28d9;
      text-decoration: none;
      font-size: 14px;
    }

    .message {
      display: none;
      margin-top: 16px;
      text-align: center;
      color: #6d28d9;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="card">
    <div class="logo">BORA LIVE</div>

    <p class="subtitle">
      Sign in to continue
    </p>

    <form id="signInForm">

      <label for="email">Email</label>
      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        required
      >

      <button type="submit">
        Sign In
      </button>

      <div class="message" id="message">
        Sign-in form submitted.
      </div>

    </form>

    <a class="back" href="index.html">
      ← Back to BORA LIVE
    </a>
  </div>

  <script>
    document.getElementById("signInForm").addEventListener("submit", function(event) {
      event.preventDefault();

      document.getElementById("message").style.display = "block";
    });
  </script>

</body>
</html>
