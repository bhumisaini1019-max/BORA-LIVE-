<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sign In — BORA LIVE</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f5f3ff, #ffffff);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(17, 24, 39, 0.12);
    }

    .logo {
      text-align: center;
      font-size: 32px;
      font-style: italic;
      color: #111827;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 32px;
    }

    label {
      display: block;
      color: #111827;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      height: 48px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      padding: 0 14px;
      font-size: 15px;
      margin-bottom: 18px;
      outline: none;
    }

    input:focus {
      border-color: #7c3aed;
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.12);
    }

    button {
      width: 100%;
      height: 48px;
      border: none;
      border-radius: 999px;
      background: #6d28d9;
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #5b21b6;
    }

    button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 24px;
      color: #6d28d9;
      text-decoration: none;
      font-size: 14px;
    }

    .message {
      display: none;
      margin-top: 16px;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
    }

    .error {
      color: #dc2626;
    }

    .success {
      color: #16a34a;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="logo">BORA LIVE</div>

    <p class="subtitle">
      Sign in to continue
    </p>

    <form id="signInForm">

      <label for="email">Email</label>

      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
      >

      <label for="password">Password</label>

      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        required
      >

      <button type="submit" id="signInButton">
        Sign In
      </button>

      <div class="message" id="message"></div>

    </form>

    <a class="back" href="index.html">
      ← Back to BORA LIVE
    </a>

  </div>


  <script type="module">

    import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword
    }
    from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


    const firebaseConfig = {
      apiKey: "AIzaSyCB8V4NP_iZrxkK3VtiL6GKTmEzHm1eFs4",
      authDomain: "bora-live.firebaseapp.com",
      projectId: "bora-live",
      storageBucket: "bora-live.firebasestorage.app",
      messagingSenderId: "650612307386",
      appId: "1:650612307386:web:c86538a49d56d47b329983"
    };


    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);


    const form = document.getElementById("signInForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const message = document.getElementById("message");
    const signInButton = document.getElementById("signInButton");


    form.addEventListener("submit", async function(event) {

      event.preventDefault();


      const email = emailInput.value.trim();
      const password = passwordInput.value;


      message.style.display = "none";

      signInButton.disabled = true;
      signInButton.textContent = "Signing in...";


      try {

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );


        message.style.display = "block";

        message.className = "message success";

        message.textContent =
          "Successfully signed in! Redirecting...";


        setTimeout(function() {

          window.location.href = "index.html";

        }, 1500);


      } catch (error) {

        message.style.display = "block";

        message.className = "message error";


        if (error.code === "auth/invalid-credential") {

          message.textContent =
            "Incorrect email or password.";

        }

        else if (error.code === "auth/user-not-found") {

          message.textContent =
            "No account found with this email.";

        }

        else if (error.code === "auth/wrong-password") {

          message.textContent =
            "Incorrect password.";

        }

        else {

          message.textContent =
            "Sign in failed. Please try again.";

          console.error(error);

        }

      }

      finally {

        signInButton.disabled = false;
        signInButton.textContent = "Sign In";

      }

    });

  </script>

</body>
</html>
