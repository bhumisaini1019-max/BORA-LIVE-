<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Account — BORA LIVE</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f5f3ff, #ffffff);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(17, 24, 39, 0.12);
    }

    .logo {
      text-align: center;
      font-size: 32px;
      font-style: italic;
      color: #111827;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 28px;
    }

    label {
      display: block;
      color: #111827;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      height: 48px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      padding: 0 14px;
      font-size: 15px;
      margin-bottom: 18px;
      outline: none;
    }

    input:focus {
      border-color: #7c3aed;
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.12);
    }

    button {
      width: 100%;
      height: 48px;
      border: none;
      border-radius: 999px;
      background: #6d28d9;
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #5b21b6;
    }

    button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 16px;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
    }

    .error {
      color: #dc2626;
    }

    .success {
      color: #16a34a;
    }

    .signin-link {
      text-align: center;
      margin-top: 22px;
      font-size: 14px;
      color: #6b7280;
    }

    .signin-link a,
    .back {
      color: #6d28d9;
      text-decoration: none;
      font-weight: 600;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 16px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="logo">BORA LIVE</div>

    <p class="subtitle">
      Create your account and start translating
    </p>

    <form id="signUpForm">

      <label for="name">Full Name</label>
      <input
        type="text"
        id="name"
        placeholder="Enter your name"
        required
      >

      <label for="email">Email</label>
      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        placeholder="Create a password (minimum 6 characters)"
        minlength="6"
        required
      >

      <label for="confirmPassword">Confirm Password</label>
      <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm your password"
        required
      >

      <button type="submit" id="signUpButton">
        Create Account
      </button>

      <div class="message" id="message"></div>

    </form>

    <div class="signin-link">
      Already have an account?
      <a href="signin.html">Sign In</a>
    </div>

    <a class="back" href="index.html">
      ← Back to BORA LIVE
    </a>

  </div>


  <script type="module">

    import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

    import {
      getAuth,
      createUserWithEmailAndPassword,
      updateProfile
    }
    from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


    const firebaseConfig = {
      apiKey: "AIzaSyCB8V4NP_iZrxkK3VtiL6GKTmEzHm1eFs4",
      authDomain: "bora-live.firebaseapp.com",
      projectId: "bora-live",
      storageBucket: "bora-live.firebasestorage.app",
      messagingSenderId: "650612307386",
      appId: "1:650612307386:web:c86538a49d56d47b329983"
    };


    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);


    const form = document.getElementById("signUpForm");
    const nameInput = document.getElementById("name");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const confirmPasswordInput =
      document.getElementById("confirmPassword");

    const message = document.getElementById("message");
    const signUpButton =
      document.getElementById("signUpButton");


    form.addEventListener("submit", async function(event) {

      event.preventDefault();


      const name = nameInput.value.trim();
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      const confirmPassword =
        confirmPasswordInput.value;


      message.style.display = "none";


      if (password !== confirmPassword) {

        message.style.display = "block";
        message.className = "message error";

        message.textContent =
          "Passwords do not match.";

        return;

      }


      signUpButton.disabled = true;
      signUpButton.textContent =
        "Creating account...";


      try {

        const userCredential =
          await createUserWithEmailAndPassword(
            auth,
            email,
            password
          );


        await updateProfile(
          userCredential.user,
          {
            displayName: name
          }
        );


        message.style.display = "block";
        message.className =
          "message success";

        message.textContent =
          "Account created successfully! Redirecting...";


        setTimeout(function() {

          window.location.href =
            "index.html";

        }, 1500);


      } catch (error) {

        message.style.display = "block";
        message.className =
          "message error";


        if (
          error.code ===
          "auth/email-already-in-use"
        ) {

          message.textContent =
            "This email already has an account.";

        }

        else if (
          error.code ===
          "auth/weak-password"
        ) {

          message.textContent =
            "Please use a stronger password.";

        }

        else if (
          error.code ===
          "auth/invalid-email"
        ) {

          message.textContent =
            "Please enter a valid email.";

        }

        else {

          message.textContent =
            "Account creation failed. Please try again.";

          console.error(error);

        }

      }

      finally {

        signUpButton.disabled = false;
        signUpButton.textContent =
          "Create Account";

      }

    });

  </script>

</body>
</html>
